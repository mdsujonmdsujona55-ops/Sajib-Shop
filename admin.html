<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sajib Shop Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:Arial,"Noto Sans Bengali",sans-serif}.bar{background:#f85606;color:#fff;padding:17px max(15px,calc((100% - 1100px)/2));font-size:21px;font-weight:bold}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:#fff;border-radius:9px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #00000008}h2{font-size:20px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;color:#555;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:5px}.btn{background:#f85606;color:#fff;border:0;padding:11px 16px;border-radius:5px;cursor:pointer}.btn.secondary{background:#555}.muted{color:#777;font-size:13px;line-height:1.6}.hidden{display:none!important}.order{border:1px solid #eee;border-radius:7px;padding:14px;margin:12px 0}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#fff0e7;color:#c94800;border-radius:20px;padding:5px 9px;font-size:12px}.order p{margin:7px 0;font-size:14px;line-height:1.5}.order select{padding:7px;border:1px solid #ddd;border-radius:4px}.notice{background:#fff8e8;padding:12px;border-radius:6px;font-size:13px;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{padding:9px 13px;border:1px solid #ddd;border-radius:5px;background:#fff;cursor:pointer}.tabs button.active{border-color:#f85606;color:#f85606}.msg{margin:10px 0;color:#087c4a}.bad{color:#b42318}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><div class="bar">🛍️ Sajib Shop — অ্যাডমিন প্যানেল</div><main class="wrap">
<section class="card" id="loginCard"><h2>অ্যাডমিন লগইন</h2><p class="muted">শুধু অনুমোদিত অ্যাডমিনের জন্য। প্রথমে README-তে দেওয়া নির্দেশনায় অ্যাডমিন অ্যাকাউন্ট তৈরি করুন।</p><form id="loginForm"><div class="grid"><div class="field"><label>ইউজারনেম</label><input name="username" required autocomplete="username"></div><div class="field"><label>পাসওয়ার্ড</label><input name="password" type="password" required autocomplete="current-password"></div></div><p><button class="btn">লগইন</button></p></form><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="card"><div class="orderhead"><h2>ড্যাশবোর্ড</h2><button class="btn secondary" id="logout">লগআউট</button></div><div class="tabs"><button class="active" data-tab="orders">অর্ডারসমূহ</button><button data-tab="products">পণ্য পরিচালনা</button></div><div class="notice">গ্রাহকের ব্যক্তিগত তথ্য গোপন রাখুন। নিয়মিত ডাটাবেস ব্যাকআপ নিন।</div></div>
<div class="card" id="ordersTab"><div class="orderhead"><h2>সাম্প্রতিক অর্ডার</h2><button class="btn" id="refreshOrders">রিফ্রেশ</button></div><div id="ordersList">লোড হচ্ছে…</div></div>
<div class="card hidden" id="productsTab"><h2>নতুন পণ্য যোগ করুন</h2><form id="productForm"><div class="grid">
<div class="field"><label>পণ্যের নাম</label><input name="name" required></div><div class="field"><label>ক্যাটাগরি</label><input name="category" placeholder="যেমন: ইলেকট্রনিক্স"></div>
<div class="field"><label>দাম (৳)</label><input name="price" type="number" min="0" required></div><div class="field"><label>আগের দাম (৳)</label><input name="old_price" type="number" min="0" value="0"></div>
<div class="field"><label>ইমোজি/আইকন</label><input name="emoji" value="🛍️"></div><div class="field"><label>স্টক</label><input name="stock" type="number" min="0" value="10"></div>
</div><p><button class="btn">পণ্য যোগ করুন</button></p></form><div id="productMsg" class="msg"></div><h2>বর্তমান পণ্য</h2><div id="productsList"></div></div></section></main>
<script>
const $=s=>document.querySelector(s);const money=n=>"৳"+Number(n).toLocaleString("bn-BD");
async function api(url,options={}){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"অনুরোধ ব্যর্থ");return d}
async function check(){try{await api("/api/admin/me");$("#loginCard").classList.add("hidden");$("#dashboard").classList.remove("hidden");loadOrders();loadProducts()}catch(e){}}
$("#loginForm").onsubmit=async e=>{e.preventDefault();$("#loginMsg").textContent="";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$("#loginCard").classList.add("hidden");$("#dashboard").classList.remove("hidden");loadOrders();loadProducts()}catch(err){$("#loginMsg").textContent=err.message;$("#loginMsg").className="msg bad"}};
$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});location.reload()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("#ordersTab").classList.toggle("hidden",b.dataset.tab!=="orders");$("#productsTab").classList.toggle("hidden",b.dataset.tab!=="products")});
async function loadOrders(){try{const orders=await api("/api/admin/orders");$("#ordersList").innerHTML=orders.length?orders.map(o=>`<article class="order"><div class="orderhead"><strong>অর্ডার #${o.id} — ${o.customer_name}</strong><span class="pill">${o.status}</span></div><p>📞 ${o.phone}<br>📍 ${o.address}<br>এলাকা: ${o.area==="inside"?"ঢাকার ভিতরে":"ঢাকার বাইরে"} · ${o.created_at}</p><p>${o.items.map(i=>`${i.name} × ${i.quantity} (${money(i.price*i.quantity)})`).join("<br>")}</p><p>পণ্য: ${money(o.subtotal)} · ডেলিভারি: ${money(o.delivery)} · <b>মোট: ${money(o.total)}</b></p>${o.note?`<p>নির্দেশনা: ${o.note}</p>`:""}<label>স্ট্যাটাস: <select onchange="changeStatus(${o.id},this.value)">${["নতুন","নিশ্চিত","প্রসেসিং","পাঠানো হয়েছে","সম্পন্ন","বাতিল"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></label></article>`).join(""):'<p class="muted">এখনো কোনো অর্ডার আসেনি।</p>'}catch(e){$("#ordersList").textContent=e.message}}
async function changeStatus(id,status){try{await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});loadOrders()}catch(e){alert(e.message)}}
async function loadProducts(){try{const ps=await api("/api/admin/products");$("#productsList").innerHTML=ps.map(p=>`<article class="order"><b>${p.emoji} ${p.name}</b><p>${p.category} · ${money(p.price)} · স্টক: ${p.stock} · ${p.active?"সক্রিয়":"নিষ্ক্রিয়"}</p><button class="btn secondary" onclick="editProduct(${p.id})">সম্পাদনা</button></article>`).join("")}catch(e){$("#productsList").textContent=e.message}}
$("#productForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/products",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$("#productMsg").textContent="পণ্য যোগ হয়েছে।";e.target.reset();loadProducts()}catch(err){$("#productMsg").textContent=err.message}};
async function editProduct(id){const p=(await api("/api/admin/products")).find(x=>x.id===id);if(!p)return;const name=prompt("পণ্যের নাম",p.name);if(name===null)return;const price=prompt("দাম (৳)",p.price);if(price===null)return;const stock=prompt("স্টক",p.stock);if(stock===null)return;const active=confirm("পণ্যটি সক্রিয় রাখবেন? OK=সক্রিয়, Cancel=নিষ্ক্রিয়");try{await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify({...p,name,price:Number(price),stock:Number(stock),active})});loadProducts()}catch(e){alert(e.message)}}
$("#refreshOrders").onclick=loadOrders;check();
</script></body></html>
